name: Build Windows x64 portable EXE

on:
  push:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 single-file executable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare build logs
        shell: pwsh
        run: New-Item -ItemType Directory -Path build-logs -Force | Out-Null

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm.cmd ci *> build-logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath build-logs/npm-ci.log
            exit $LASTEXITCODE
          }

      - name: Build portable executable only
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: |
          npm.cmd run tauri -- build --target x86_64-pc-windows-msvc --no-bundle *> build-logs/tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath build-logs/tauri-build.log
            exit $LASTEXITCODE
          }

      - name: Collect single-file EXE
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = Join-Path $PWD 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $source = Join-Path $targetRoot 'floral-notepaper.exe'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Portable executable was not found at $source"
          }

          $version = (Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to read application version.' }

          $outputDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $output = Join-Path $outputDir "floral-notepaper_${version}_x64.exe"
          Copy-Item -LiteralPath $source -Destination $output -Force

          $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($output))" | Set-Content -LiteralPath (Join-Path $outputDir 'SHA256SUMS.txt')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload portable artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: floral-notepaper-windows-x64-portable-${{ steps.collect.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Collect build diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $nodeVersion = (node --version 2>&1 | Out-String).Trim()
          $npmVersion = (npm.cmd --version 2>&1 | Out-String).Trim()
          $rustVersion = (rustc --version 2>&1 | Out-String).Trim()
          @(
            "workflow=${{ github.workflow }}"
            "run_id=${{ github.run_id }}"
            "sha=${{ github.sha }}"
            "ref=${{ github.ref }}"
            "node=$nodeVersion"
            "npm=$npmVersion"
            "rust=$rustVersion"
          ) | Set-Content -LiteralPath build-logs/build-environment.txt
          git status --short *> build-logs/git-status.txt
          if (Test-Path -LiteralPath 'npm-debug.log') {
            Copy-Item -LiteralPath 'npm-debug.log' -Destination 'build-logs/npm-debug.log' -Force
          }
          if (-not (Get-ChildItem -LiteralPath build-logs -File -ErrorAction SilentlyContinue)) {
            'No build log was produced before the job stopped.' | Set-Content -LiteralPath build-logs/no-log.txt
          }

      - name: Stage build logs for log upload job
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: floral-notepaper-windows-x64-build-logs-staging-${{ github.run_id }}
          path: build-logs/*
          if-no-files-found: warn
          retention-days: 3

  upload-logs:
    name: Upload build logs artifact
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download staged build logs
        uses: actions/download-artifact@v4
        with:
          name: floral-notepaper-windows-x64-build-logs-staging-${{ github.run_id }}
          path: build-logs
        continue-on-error: true

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: floral-notepaper-windows-x64-build-logs-${{ github.run_id }}
          path: build-logs/*
          if-no-files-found: warn
          retention-days: 14
